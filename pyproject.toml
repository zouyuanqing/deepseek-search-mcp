[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepseek-search-mcp"
version = "0.3.0"
description = "Web search MCP server: DeepSeek V4-Flash native search + Xiaomi MiMo raw search + fetch_page, with auto fallback chain"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[tool.setuptools]
packages = ["mcp_search"]
py-modules = ["deepseek_web_search_mcp"]
